plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yugo.signage.tvplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yugo.signage.tvplayer'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}
